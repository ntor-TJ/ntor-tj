<svg viewBox="0 0 1600 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <pattern id="sGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#1E293B" stroke-width="0.3" opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="1600" height="340" fill="url(#sBg)"/>
  <rect width="1600" height="340" fill="url(#sGrid)"/>

  <text x="800" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" letter-spacing="4" fill="#38BDF8" opacity="0.8">WHAT I BUILD</text>

  <!-- Card 1: Full-Stack Platforms -->
  <g>
    <rect x="60" y="65" width="355" height="240" rx="18" fill="#0F172A" opacity="0.7" stroke="#3B82F6" stroke-opacity="0.25"/>
    <rect x="60" y="65" width="355" height="3" rx="1.5" fill="#3B82F6" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- Icon: code brackets -->
    <text x="90" y="115" font-size="32" fill="#3B82F6" opacity="0.8">&lt;/&gt;</text>
    <text x="90" y="150" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">Full-Stack Platforms</text>
    <text font-family="Inter, sans-serif" font-size="13" fill="#94A3B8">
      <tspan x="90" y="178">End-to-end web applications from</tspan>
      <tspan x="90" y="198">database design to responsive UI,</tspan>
      <tspan x="90" y="218">deployed and monitored in production.</tspan>
    </text>
    <g font-family="Inter, sans-serif" font-size="10" fill="#93C5FD">
      <rect x="90" y="240" width="48" height="22" rx="6" fill="#020617" stroke="#3B82F6" stroke-opacity="0.3"/>
      <text x="114" y="255" text-anchor="middle">PHP</text>
      <rect x="146" y="240" width="70" height="22" rx="6" fill="#020617" stroke="#3B82F6" stroke-opacity="0.3"/>
      <text x="181" y="255" text-anchor="middle">Next.js</text>
      <rect x="224" y="240" width="65" height="22" rx="6" fill="#020617" stroke="#3B82F6" stroke-opacity="0.3"/>
      <text x="256" y="255" text-anchor="middle">Python</text>
    </g>
  </g>

  <!-- Card 2: E-Commerce Engineering -->
  <g>
    <rect x="440" y="65" width="355" height="240" rx="18" fill="#0F172A" opacity="0.7" stroke="#8B5CF6" stroke-opacity="0.25"/>
    <rect x="440" y="65" width="355" height="3" rx="1.5" fill="#8B5CF6" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <text x="470" y="115" font-size="32" fill="#8B5CF6" opacity="0.8">🛒</text>
    <text x="470" y="150" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">E-Commerce Engineering</text>
    <text font-family="Inter, sans-serif" font-size="13" fill="#94A3B8">
      <tspan x="470" y="178">Marketplace platforms with payment</tspan>
      <tspan x="470" y="198">integrations, inventory management,</tspan>
      <tspan x="470" y="218">and multi-vendor architectures.</tspan>
    </text>
    <g font-family="Inter, sans-serif" font-size="10" fill="#C4B5FD">
      <rect x="470" y="240" width="55" height="22" rx="6" fill="#020617" stroke="#8B5CF6" stroke-opacity="0.3"/>
      <text x="497" y="255" text-anchor="middle">React</text>
      <rect x="533" y="240" width="48" height="22" rx="6" fill="#020617" stroke="#8B5CF6" stroke-opacity="0.3"/>
      <text x="557" y="255" text-anchor="middle">UPI</text>
      <rect x="589" y="240" width="55" height="22" rx="6" fill="#020617" stroke="#8B5CF6" stroke-opacity="0.3"/>
      <text x="616" y="255" text-anchor="middle">REST</text>
    </g>
  </g>

  <!-- Card 3: Business Systems -->
  <g>
    <rect x="820" y="65" width="355" height="240" rx="18" fill="#0F172A" opacity="0.7" stroke="#06B6D4" stroke-opacity="0.25"/>
    <rect x="820" y="65" width="355" height="3" rx="1.5" fill="#06B6D4" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="850" y="115" font-size="32" fill="#06B6D4" opacity="0.8">📊</text>
    <text x="850" y="150" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">Business Systems</text>
    <text font-family="Inter, sans-serif" font-size="13" fill="#94A3B8">
      <tspan x="850" y="178">CRMs, HRMS, attendance trackers,</tspan>
      <tspan x="850" y="198">and BI dashboards that turn messy</tspan>
      <tspan x="850" y="218">spreadsheets into real systems.</tspan>
    </text>
    <g font-family="Inter, sans-serif" font-size="10" fill="#67E8F9">
      <rect x="850" y="240" width="70" height="22" rx="6" fill="#020617" stroke="#06B6D4" stroke-opacity="0.3"/>
      <text x="885" y="255" text-anchor="middle">MySQL</text>
      <rect x="928" y="240" width="70" height="22" rx="6" fill="#020617" stroke="#06B6D4" stroke-opacity="0.3"/>
      <text x="963" y="255" text-anchor="middle">Chart.js</text>
      <rect x="1006" y="240" width="55" height="22" rx="6" fill="#020617" stroke="#06B6D4" stroke-opacity="0.3"/>
      <text x="1033" y="255" text-anchor="middle">CSV</text>
    </g>
  </g>

  <!-- Card 4: AI & Automation -->
  <g>
    <rect x="1200" y="65" width="355" height="240" rx="18" fill="#0F172A" opacity="0.7" stroke="#F59E0B" stroke-opacity="0.25"/>
    <rect x="1200" y="65" width="355" height="3" rx="1.5" fill="#F59E0B" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="1230" y="115" font-size="32" fill="#F59E0B" opacity="0.8">🤖</text>
    <text x="1230" y="150" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">AI &amp; Automation</text>
    <text font-family="Inter, sans-serif" font-size="13" fill="#94A3B8">
      <tspan x="1230" y="178">Intelligent workflows, data pipelines,</tspan>
      <tspan x="1230" y="198">and ML-powered features that make</tspan>
      <tspan x="1230" y="218">products smarter over time.</tspan>
    </text>
    <g font-family="Inter, sans-serif" font-size="10" fill="#FCD34D">
      <rect x="1230" y="240" width="70" height="22" rx="6" fill="#020617" stroke="#F59E0B" stroke-opacity="0.3"/>
      <text x="1265" y="255" text-anchor="middle">FastAPI</text>
      <rect x="1308" y="240" width="80" height="22" rx="6" fill="#020617" stroke="#F59E0B" stroke-opacity="0.3"/>
      <text x="1348" y="255" text-anchor="middle">Pandas</text>
      <rect x="1396" y="240" width="48" height="22" rx="6" fill="#020617" stroke="#F59E0B" stroke-opacity="0.3"/>
      <text x="1420" y="255" text-anchor="middle">ML</text>
    </g>
  </g>
</svg>
