<svg viewBox="0 0 1600 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sBgL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="sGridL" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#E2E8F0" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1600" height="340" fill="url(#sBgL)"/>
  <rect width="1600" height="340" fill="url(#sGridL)"/>

  <text x="800" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" letter-spacing="4" fill="#2563EB" opacity="0.7">WHAT I BUILD</text>

  <!-- Card 1 -->
  <g>
    <rect x="60" y="65" width="355" height="240" rx="18" fill="#FFFFFF" stroke="#3B82F6" stroke-opacity="0.15"/>
    <rect x="60" y="65" width="355" height="3" rx="1.5" fill="#3B82F6" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.15;0.35" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="90" y="115" font-size="32" fill="#3B82F6" opacity="0.7">&lt;/&gt;</text>
    <text x="90" y="150" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#0F172A">Full-Stack Platforms</text>
    <text font-family="Inter, sans-serif" font-size="13" fill="#64748B">
      <tspan x="90" y="178">End-to-end web applications from</tspan>
      <tspan x="90" y="198">database design to responsive UI,</tspan>
      <tspan x="90" y="218">deployed and monitored in production.</tspan>
    </text>
    <g font-family="Inter, sans-serif" font-size="10" fill="#2563EB">
      <rect x="90" y="240" width="48" height="22" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-opacity="0.2"/>
      <text x="114" y="255" text-anchor="middle">PHP</text>
      <rect x="146" y="240" width="70" height="22" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-opacity="0.2"/>
      <text x="181" y="255" text-anchor="middle">Next.js</text>
      <rect x="224" y="240" width="65" height="22" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-opacity="0.2"/>
      <text x="256" y="255" text-anchor="middle">Python</text>
    </g>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="440" y="65" width="355" height="240" rx="18" fill="#FFFFFF" stroke="#8B5CF6" stroke-opacity="0.15"/>
    <rect x="440" y="65" width="355" height="3" rx="1.5" fill="#8B5CF6" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.15;0.35" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <text x="470" y="115" font-size="32" fill="#8B5CF6" opacity="0.7">🛒</text>
    <text x="470" y="150" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#0F172A">E-Commerce Engineering</text>
    <text font-family="Inter, sans-serif" font-size="13" fill="#64748B">
      <tspan x="470" y="178">Marketplace platforms with payment</tspan>
      <tspan x="470" y="198">integrations, inventory management,</tspan>
      <tspan x="470" y="218">and multi-vendor architectures.</tspan>
    </text>
    <g font-family="Inter, sans-serif" font-size="10" fill="#7C3AED">
      <rect x="470" y="240" width="55" height="22" rx="6" fill="#F5F3FF" stroke="#8B5CF6" stroke-opacity="0.2"/>
      <text x="497" y="255" text-anchor="middle">React</text>
      <rect x="533" y="240" width="48" height="22" rx="6" fill="#F5F3FF" stroke="#8B5CF6" stroke-opacity="0.2"/>
      <text x="557" y="255" text-anchor="middle">UPI</text>
      <rect x="589" y="240" width="55" height="22" rx="6" fill="#F5F3FF" stroke="#8B5CF6" stroke-opacity="0.2"/>
      <text x="616" y="255" text-anchor="middle">REST</text>
    </g>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="820" y="65" width="355" height="240" rx="18" fill="#FFFFFF" stroke="#06B6D4" stroke-opacity="0.15"/>
    <rect x="820" y="65" width="355" height="3" rx="1.5" fill="#06B6D4" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.15;0.35" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="850" y="115" font-size="32" fill="#06B6D4" opacity="0.7">📊</text>
    <text x="850" y="150" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#0F172A">Business Systems</text>
    <text font-family="Inter, sans-serif" font-size="13" fill="#64748B">
      <tspan x="850" y="178">CRMs, HRMS, attendance trackers,</tspan>
      <tspan x="850" y="198">and BI dashboards that turn messy</tspan>
      <tspan x="850" y="218">spreadsheets into real systems.</tspan>
    </text>
    <g font-family="Inter, sans-serif" font-size="10" fill="#0891B2">
      <rect x="850" y="240" width="70" height="22" rx="6" fill="#ECFEFF" stroke="#06B6D4" stroke-opacity="0.2"/>
      <text x="885" y="255" text-anchor="middle">MySQL</text>
      <rect x="928" y="240" width="70" height="22" rx="6" fill="#ECFEFF" stroke="#06B6D4" stroke-opacity="0.2"/>
      <text x="963" y="255" text-anchor="middle">Chart.js</text>
      <rect x="1006" y="240" width="55" height="22" rx="6" fill="#ECFEFF" stroke="#06B6D4" stroke-opacity="0.2"/>
      <text x="1033" y="255" text-anchor="middle">CSV</text>
    </g>
  </g>

  <!-- Card 4 -->
  <g>
    <rect x="1200" y="65" width="355" height="240" rx="18" fill="#FFFFFF" stroke="#F59E0B" stroke-opacity="0.15"/>
    <rect x="1200" y="65" width="355" height="3" rx="1.5" fill="#F59E0B" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.15;0.35" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="1230" y="115" font-size="32" fill="#F59E0B" opacity="0.7">🤖</text>
    <text x="1230" y="150" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#0F172A">AI &amp; Automation</text>
    <text font-family="Inter, sans-serif" font-size="13" fill="#64748B">
      <tspan x="1230" y="178">Intelligent workflows, data pipelines,</tspan>
      <tspan x="1230" y="198">and ML-powered features that make</tspan>
      <tspan x="1230" y="218">products smarter over time.</tspan>
    </text>
    <g font-family="Inter, sans-serif" font-size="10" fill="#B45309">
      <rect x="1230" y="240" width="70" height="22" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-opacity="0.2"/>
      <text x="1265" y="255" text-anchor="middle">FastAPI</text>
      <rect x="1308" y="240" width="80" height="22" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-opacity="0.2"/>
      <text x="1348" y="255" text-anchor="middle">Pandas</text>
      <rect x="1396" y="240" width="48" height="22" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-opacity="0.2"/>
      <text x="1420" y="255" text-anchor="middle">ML</text>
    </g>
  </g>
</svg>
