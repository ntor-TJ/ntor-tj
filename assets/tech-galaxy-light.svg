<svg viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tgBgL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="tgGridL" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#E2E8F0" stroke-width="0.3" opacity="0.3"/>
    </pattern>
    <radialGradient id="coreGlowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#tgBgL)"/>
  <rect width="1600" height="500" fill="url(#tgGridL)"/>

  <text x="800" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" letter-spacing="4" fill="#2563EB" opacity="0.7">TECHNOLOGY UNIVERSE</text>

  <circle cx="800" cy="270" r="220" fill="url(#coreGlowL)"/>

  <!-- Orbit rings -->
  <ellipse cx="800" cy="270" rx="100" ry="100" fill="none" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="4,6" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" values="0 800 270;360 800 270" dur="60s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="800" cy="270" rx="180" ry="130" fill="none" stroke="#CBD5E1" stroke-width="0.6" stroke-dasharray="3,8" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" values="0 800 270;-360 800 270" dur="90s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="800" cy="270" rx="280" ry="170" fill="none" stroke="#CBD5E1" stroke-width="0.5" stroke-dasharray="2,10" opacity="0.35">
    <animateTransform attributeName="transform" type="rotate" values="0 800 270;360 800 270" dur="120s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Core -->
  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="700">
    <g>
      <rect x="720" y="246" width="70" height="48" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-opacity="0.4"/>
      <text x="755" y="276" text-anchor="middle" font-size="16" fill="#2563EB">PHP</text>
    </g>
    <g>
      <rect x="810" y="246" width="90" height="48" rx="14" fill="#FFFFFF" stroke="#06B6D4" stroke-opacity="0.4"/>
      <text x="855" y="276" text-anchor="middle" font-size="16" fill="#0891B2">Python</text>
    </g>
    <text x="800" y="225" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" letter-spacing="2" fill="#94A3B8" font-weight="400">CORE LANGUAGES</text>
    <text x="800" y="318" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" letter-spacing="2" fill="#94A3B8" font-weight="400">DAILY DRIVERS</text>
  </g>

  <!-- Inner orbit -->
  <g font-family="Inter, sans-serif" font-size="12" font-weight="600">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="4s" repeatCount="indefinite"/>
      <rect x="605" y="195" width="110" height="34" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-opacity="0.3"/>
      <text x="660" y="217" text-anchor="middle" fill="#7C3AED">TypeScript</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,6;0,0" dur="4.5s" repeatCount="indefinite"/>
      <rect x="935" y="195" width="90" height="34" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-opacity="0.3"/>
      <text x="980" y="217" text-anchor="middle" fill="#2563EB">Next.js</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="3.8s" repeatCount="indefinite"/>
      <rect x="610" y="315" width="95" height="34" rx="10" fill="#FFFFFF" stroke="#06B6D4" stroke-opacity="0.3"/>
      <text x="658" y="337" text-anchor="middle" fill="#0891B2">FastAPI</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,7;0,0" dur="5s" repeatCount="indefinite"/>
      <rect x="930" y="315" width="90" height="34" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-opacity="0.3"/>
      <text x="975" y="337" text-anchor="middle" fill="#7C3AED">NestJS</text>
    </g>
    <text x="800" y="175" text-anchor="middle" font-size="10" letter-spacing="2" fill="#94A3B8" font-weight="400">FRAMEWORKS</text>
  </g>

  <!-- Outer orbit -->
  <g font-family="Inter, sans-serif" font-size="11" font-weight="600">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="5.5s" repeatCount="indefinite"/>
      <rect x="430" y="160" width="105" height="32" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-opacity="0.25"/>
      <text x="483" y="181" text-anchor="middle" fill="#2563EB">PostgreSQL</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,9;0,0" dur="4.8s" repeatCount="indefinite"/>
      <rect x="1080" y="160" width="80" height="32" rx="10" fill="#FFFFFF" stroke="#06B6D4" stroke-opacity="0.25"/>
      <text x="1120" y="181" text-anchor="middle" fill="#0891B2">MySQL</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0" dur="6s" repeatCount="indefinite"/>
      <rect x="440" y="330" width="100" height="32" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-opacity="0.25"/>
      <text x="490" y="351" text-anchor="middle" fill="#7C3AED">Bootstrap</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,6;0,0" dur="5.2s" repeatCount="indefinite"/>
      <rect x="1085" y="330" width="85" height="32" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-opacity="0.25"/>
      <text x="1128" y="351" text-anchor="middle" fill="#2563EB">Chart.js</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="4.3s" repeatCount="indefinite"/>
      <rect x="345" y="240" width="76" height="32" rx="10" fill="#FFFFFF" stroke="#06B6D4" stroke-opacity="0.25"/>
      <text x="383" y="261" text-anchor="middle" fill="#0891B2">Prisma</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,8;0,0" dur="5.8s" repeatCount="indefinite"/>
      <rect x="1195" y="240" width="80" height="32" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-opacity="0.25"/>
      <text x="1235" y="261" text-anchor="middle" fill="#7C3AED">Kotlin</text>
    </g>
    <text x="800" y="115" text-anchor="middle" font-size="10" letter-spacing="2" fill="#94A3B8" font-weight="400">DATABASES · TOOLS · MOBILE</text>
  </g>

  <!-- Outermost -->
  <g font-family="Inter, sans-serif" font-size="10" font-weight="500">
    <g opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="6.5s" repeatCount="indefinite"/>
      <rect x="200" y="200" width="90" height="28" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="245" y="218" text-anchor="middle" fill="#94A3B8">Docker</text>
    </g>
    <g opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,6;0,0" dur="7s" repeatCount="indefinite"/>
      <rect x="1320" y="200" width="85" height="28" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="1363" y="218" text-anchor="middle" fill="#94A3B8">CI/CD</text>
    </g>
    <g opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="5.5s" repeatCount="indefinite"/>
      <rect x="215" y="310" width="100" height="28" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="265" y="328" text-anchor="middle" fill="#94A3B8">Power BI</text>
    </g>
    <g opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,5;0,0" dur="6.2s" repeatCount="indefinite"/>
      <rect x="1310" y="310" width="110" height="28" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="1365" y="328" text-anchor="middle" fill="#94A3B8">React Native</text>
    </g>
  </g>

  <!-- Orbiting dots -->
  <g>
    <circle r="3" fill="#3B82F6" opacity="0.35">
      <animateMotion dur="20s" repeatCount="indefinite" path="M800,270 m-100,0 a100,100 0 1,0 200,0 a100,100 0 1,0 -200,0"/>
    </circle>
    <circle r="2.5" fill="#8B5CF6" opacity="0.3">
      <animateMotion dur="30s" repeatCount="indefinite" path="M800,270 m-180,0 a180,130 0 1,1 360,0 a180,130 0 1,1 -360,0"/>
    </circle>
    <circle r="2" fill="#06B6D4" opacity="0.25">
      <animateMotion dur="45s" repeatCount="indefinite" path="M800,270 m-280,0 a280,170 0 1,0 560,0 a280,170 0 1,0 -560,0"/>
    </circle>
  </g>

  <text x="800" y="480" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8" opacity="0.6">Technologies I work with daily — orbiting the core stack</text>
</svg>
