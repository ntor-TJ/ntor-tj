<svg viewBox="0 0 1600 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <pattern id="wfGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#1E293B" stroke-width="0.3" opacity="0.2"/>
    </pattern>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="280" fill="url(#wfBg)"/>
  <rect width="1600" height="280" fill="url(#wfGrid)"/>

  <text x="800" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" letter-spacing="4" fill="#38BDF8" opacity="0.8">HOW I WORK</text>

  <!-- Pipeline connector -->
  <line x1="200" y1="140" x2="1400" y2="140" stroke="url(#pipeGrad)" stroke-width="2" stroke-opacity="0.25"/>
  <!-- Animated flowing dot -->
  <circle r="4" fill="#3B82F6" opacity="0.7">
    <animateMotion dur="4s" repeatCount="indefinite" path="M200,140 L1400,140"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#8B5CF6" opacity="0.5">
    <animateMotion dur="4s" repeatCount="indefinite" path="M200,140 L1400,140" begin="1.3s"/>
    <animate attributeName="opacity" values="0;0.6;0.6;0" dur="4s" repeatCount="indefinite" begin="1.3s"/>
  </circle>
  <circle r="3.5" fill="#06B6D4" opacity="0.5">
    <animateMotion dur="4s" repeatCount="indefinite" path="M200,140 L1400,140" begin="2.6s"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" dur="4s" repeatCount="indefinite" begin="2.6s"/>
  </circle>

  <!-- Stage 1: Discovery -->
  <g>
    <circle cx="200" cy="140" r="32" fill="#0F172A" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="200" y="146" text-anchor="middle" font-size="22">🔍</text>
    <text x="200" y="196" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Discovery</text>
    <text x="200" y="216" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Requirements</text>
  </g>

  <!-- Stage 2: Design -->
  <g>
    <circle cx="440" cy="140" r="32" fill="#0F172A" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="440" y="146" text-anchor="middle" font-size="22">🎨</text>
    <text x="440" y="196" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Design</text>
    <text x="440" y="216" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Architecture</text>
  </g>

  <!-- Stage 3: Build -->
  <g>
    <circle cx="680" cy="140" r="32" fill="#0F172A" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="680" y="146" text-anchor="middle" font-size="22">⚙️</text>
    <text x="680" y="196" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Build</text>
    <text x="680" y="216" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Development</text>
  </g>

  <!-- Stage 4: Test -->
  <g>
    <circle cx="920" cy="140" r="32" fill="#0F172A" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="920" y="146" text-anchor="middle" font-size="22">🧪</text>
    <text x="920" y="196" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Test</text>
    <text x="920" y="216" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748B">QA &amp; Review</text>
  </g>

  <!-- Stage 5: Deploy -->
  <g>
    <circle cx="1160" cy="140" r="32" fill="#0F172A" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="1160" y="146" text-anchor="middle" font-size="22">🚀</text>
    <text x="1160" y="196" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Deploy</text>
    <text x="1160" y="216" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Ship to prod</text>
  </g>

  <!-- Stage 6: Support -->
  <g>
    <circle cx="1400" cy="140" r="32" fill="#0F172A" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="1400" y="146" text-anchor="middle" font-size="22">🛡️</text>
    <text x="1400" y="196" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Support</text>
    <text x="1400" y="216" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Monitor &amp; iterate</text>
  </g>

  <!-- Step numbers -->
  <g font-family="Inter, sans-serif" font-size="9" fill="#475569" font-weight="600">
    <text x="200" y="250" text-anchor="middle">01</text>
    <text x="440" y="250" text-anchor="middle">02</text>
    <text x="680" y="250" text-anchor="middle">03</text>
    <text x="920" y="250" text-anchor="middle">04</text>
    <text x="1160" y="250" text-anchor="middle">05</text>
    <text x="1400" y="250" text-anchor="middle">06</text>
  </g>
</svg>
